# Local development database.
# Spring Boot starts it for you when you run the app (spring-boot-docker-compose)
# and stops it when the app stops. To run it on its own: docker compose up -d
services:
  postgres:
    # Pinned major version: "latest" could jump to a new major without warning.
    # Keep it in sync with TestcontainersConfiguration.
    image: 'postgres:17'
    environment:
      POSTGRES_DB: extpulse
      POSTGRES_USER: extpulse
      POSTGRES_PASSWORD: extpulse
    ports:
      # Host port 5433, so it doesn't clash with a PostgreSQL already installed on 5432.
      - '5433:5432'
    volumes:
      # Keeps the data between restarts. `docker compose down -v` deletes it.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U extpulse -d extpulse']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches the alert emails in development: nothing leaves the machine. The inbox is
    # at http://localhost:8025; the app sends to localhost:1025 (spring.mail in application.yaml).
    image: 'axllent/mailpit:v1.32.0'
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
