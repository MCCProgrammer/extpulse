# Production, on the Oracle Cloud server in /opt/extpulse. deploy.sh runs it with the
# image tag being deployed. Secrets (database password, JWT key) are in .env, which is
# created on the server and never leaves it.
# Its own project name: on a machine that also runs the development compose.yaml (also
# "extpulse"), the two would share containers and volumes.
name: extpulse-production

# The server's list of trusted certificate authorities, kept current by Ubuntu's
# security updates (unattended-upgrades), for the services that call out over HTTPS.
# Their images bring their own copy, which lags: in October 2026 it still trusted a root
# of eMudhra's after keys under it leaked.
x-ca-certificates: &ca-certificates /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro

x-logging: &logging
  # Container logs are kept, but bounded: 5 files of 10 MB per service.
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  app:
    image: ghcr.io/mccprogrammer/extpulse:${EXTPULSE_IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/extpulse
      SPRING_DATASOURCE_USERNAME: extpulse
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?missing from .env}
      EXTPULSE_AUTH_JWT_SECRET: ${EXTPULSE_AUTH_JWT_SECRET:?missing from .env}
      EXTPULSE_AUTH_REGISTRATION_OPEN: 'false'
      EXTPULSE_AUTH_REGISTRATION_ALLOW_LIST: ${EXTPULSE_AUTH_REGISTRATION_ALLOW_LIST:-}
      # Behind Caddy: trust its X-Forwarded-* headers, so the app knows it is served over HTTPS.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # The dashboard's session cookie only travels over HTTPS.
      SERVER_SERVLET_SESSION_COOKIE_SECURE: 'true'
      # The actuator (health, metrics) on its own port, which isn't published or
      # proxied: Prometheus and the health check reach it inside this network only.
      MANAGEMENT_SERVER_PORT: '8081'
      # Logs as JSON (Elastic Common Schema), one object per line, with fields to filter on.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    # Optional settings that only exist once chosen, such as the SMTP provider for alert
    # emails (SPRING_MAIL_HOST, _PORT, _USERNAME, _PASSWORD). Alerts by Discord work without it.
    env_file:
      - path: ./app.env
        required: false
    # The heap is 75% of this (see the Dockerfile).
    mem_limit: 1g
    healthcheck:
      # The image has no curl or wget; bash can make the HTTP request itself.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging

  postgres:
    # The same major version as development and tests.
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: extpulse
      POSTGRES_USER: extpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing from .env}
    # No ports: only the app and the backup reach it, inside this Compose network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U extpulse -d extpulse']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  caddy:
    # HTTPS with certificates from Let's Encrypt, obtained and renewed by Caddy.
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      EXTPULSE_DOMAIN: ${EXTPULSE_DOMAIN:-extpulse.mccprogrammer.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging: *logging

  backup:
    # A pg_dump every day into ./backups on the server, keeping 14 days.
    image: postgres:17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: extpulse
      PGDATABASE: extpulse
      PGPASSWORD: ${POSTGRES_PASSWORD:?missing from .env}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ['sh', '/backup.sh']
    mem_limit: 128m
    logging: *logging

  offsite:
    # A copy of each backup in Oracle Object Storage, off this server (offsite.sh). It
    # signs in as the server itself (instance principal): no key here or in .env.
    image: rclone/rclone:1.75.2
    restart: unless-stopped
    environment:
      # The remote is defined here, in memory: no rclone.conf.
      RCLONE_CONFIG: ''
      RCLONE_CONFIG_OFFSITE_TYPE: oracleobjectstorage
      RCLONE_CONFIG_OFFSITE_PROVIDER: instance_principal_auth
      # From `terraform output backup_namespace`; until it is in .env, copies are off.
      RCLONE_CONFIG_OFFSITE_NAMESPACE: ${OCI_NAMESPACE:-}
      RCLONE_CONFIG_OFFSITE_REGION: eu-madrid-1
      # The bucket is Terraform's; the server isn't allowed to create or change it.
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: 'true'
      OFFSITE_BUCKET: extpulse-backups
      PUSHGATEWAY_URL: http://pushgateway:9091
    depends_on:
      - pushgateway
    volumes:
      - ./offsite.sh:/offsite.sh:ro
      - ./backups:/backups:ro
      - *ca-certificates
    entrypoint: ['sh', '/offsite.sh']
    mem_limit: 128m
    logging: *logging

  # Monitoring. The web interfaces listen on the server's localhost only: they are
  # opened through an SSH tunnel (deploy/README.md), never from the internet.
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 384m
    logging: *logging

  pushgateway:
    # Keeps the times the nightly backup jobs push (offsite.sh) until Prometheus reads
    # them: a job that runs once a day has no endpoint to scrape. Saved to its volume, so
    # a restart doesn't lose them.
    image: prom/pushgateway:v1.11.4
    restart: unless-stopped
    command:
      - --persistence.file=/pushgateway/metrics
      - --persistence.interval=1m
    volumes:
      - pushgateway-data:/pushgateway
    mem_limit: 32m
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
      - *ca-certificates
    mem_limit: 64m
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?missing from .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
      - *ca-certificates
    mem_limit: 256m
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  pushgateway-data:
  alertmanager-data:
  grafana-data:
