# Unit tests for alerts.yml: `promtool test rules alerts.test.yml` (CI runs them).
# Series values are Unix times, and time() is the seconds since the test started, so a
# value of 0 is as old as the evaluation time.
rule_files:
  - alerts.yml

evaluation_interval: 30s

tests:
  - name: The app stops answering
    interval: 1m
    input_series:
      - series: up{job="extpulse", instance="app:8081"}
        values: 0x10
    alert_rule_test:
      - eval_time: 4m
        alertname: ExtPulseDown
        exp_alerts: []
      - eval_time: 6m
        alertname: ExtPulseDown
        exp_alerts:
          - exp_labels: { severity: critical, job: extpulse, instance: app:8081 }
            exp_annotations: { summary: ExtPulse has not answered Prometheus for 5 minutes. }

  - name: No collection for more than 26 hours
    interval: 1m
    input_series:
      - series: extpulse_collection_last_success_seconds{job="extpulse", instance="app:8081"}
        values: 0x1800
    alert_rule_test:
      - eval_time: 25h
        alertname: CollectionLate
        exp_alerts: []
      - eval_time: 27h
        alertname: CollectionLate
        exp_alerts:
          - exp_labels: { severity: critical, job: extpulse, instance: app:8081 }
            exp_annotations: { summary: No collection has worked for more than 26 hours. }

  - name: The newest dump is too old
    interval: 1m
    input_series:
      - series: extpulse_backup_newest_dump_timestamp_seconds{job="offsite"}
        values: 0x1800
      - series: extpulse_offsite_last_success_timestamp_seconds{job="offsite"}
        values: 0x1800
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupLate
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupLate
        exp_alerts:
          - exp_labels: { severity: critical, job: offsite }
            exp_annotations: { summary: The newest database dump on the server is more than 26 hours old. }
      - eval_time: 27h
        alertname: OffsiteBackupLate
        exp_alerts: []

  - name: The copy to Object Storage stops working
    interval: 1m
    input_series:
      - series: extpulse_offsite_last_success_timestamp_seconds{job="offsite"}
        values: 0x1800
    alert_rule_test:
      - eval_time: 26h30m
        alertname: OffsiteBackupLate
        exp_alerts: []
      - eval_time: 27h30m
        alertname: OffsiteBackupLate
        exp_alerts:
          - exp_labels: { severity: critical, job: offsite }
            exp_annotations: { summary: No backup has reached Object Storage for more than 26 hours. }

  - name: Nothing pushed at all
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 30m
        alertname: OffsiteBackupLate
        exp_alerts: []
      - eval_time: 61m
        alertname: OffsiteBackupLate
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: No backup has reached Object Storage for more than 26 hours. }
