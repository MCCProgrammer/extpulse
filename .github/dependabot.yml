# Weekly pull requests for outdated dependencies, grouped so a week brings a few PRs,
# not one per library. CI runs on each, so an update that breaks a test is visible.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  # The base images in the Dockerfile and the services in compose.yaml.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Development's compose.yaml and production's deploy/compose.yaml.
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
      day: monday
    ignore:
      # A new PostgreSQL major needs its data migrated (pg_upgrade) and the same version
      # in TestcontainersConfiguration: a planned change, not a weekly update.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
