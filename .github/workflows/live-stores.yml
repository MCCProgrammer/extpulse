name: Live stores

# The store tests in CI use recorded responses. This runs the store adapters against
# the real stores once a week, so a change on their side (above all the Chrome Web
# Store page) shows up as a failed run, which GitHub emails about.
on:
  schedule:
    - cron: '0 7 * * 1' # Mondays, 07:00 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Only the tests tagged "live"; the pom leaves them out of every other build.
      - name: Test against the real stores
        run: ./mvnw -B test -Dgroups=live -DexcludedGroups=
