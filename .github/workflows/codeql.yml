name: CodeQL

# Static analysis for security problems (injection, unsafe deserialization, weak crypto)
# in the Java code and in these workflows. Results appear under Security, Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 3' # Wednesdays: new queries also run on code that didn't change

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]
    steps:
      - uses: actions/checkout@v7

      # build-mode none: CodeQL reads the Java sources without compiling them.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
