name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs read the code; a job that needs more says so.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: SonarQube Cloud uses it to tell new code from old.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Checks formatting, compiles, runs every test (Testcontainers uses the runner's
      # Docker), packages the jar and checks test coverage (JaCoCo; the limits are in pom.xml).
      - name: Build and test
        run: ./mvnw -B verify

      # Code quality, bugs and coverage on sonarcloud.io; skipped until the token is set
      # (and on pull requests from forks, which don't get secrets).
      - name: SonarQube Cloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./mvnw -B sonar:sonar

      # Coverage in the run's summary page, also when the coverage check failed.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('target/site/jacoco/jacoco.csv') != '' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          def total(kind):
              covered = sum(int(r[kind + "_COVERED"]) for r in rows)
              missed = sum(int(r[kind + "_MISSED"]) for r in rows)
              return 100 * covered / (covered + missed), covered, covered + missed
          print("### Test coverage\n")
          print("| | Covered | |\n| --- | --- | --- |")
          for kind, name in (("LINE", "Lines"), ("BRANCH", "Branches")):
              percent, covered, all_ = total(kind)
              print(f"| {name} | {percent:.1f}% | {covered} of {all_} |")
          print("\nLimits: lines 85%, branches 70%, each *Service class 80% of lines.")
          EOF

      # The HTML report, to download from the run's page and see which lines are missed.
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('target/site/jacoco/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14

  secrets:
    # Every commit, not only the last: a secret deleted later is still in the history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the history for secrets (gitleaks)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  image:
    # The production image. Built on an Arm runner, natively, because the server
    # (Oracle Cloud Ampere A1) is Arm. Pull requests build it to check the Dockerfile;
    # pushes to main also publish it to the GitHub Container Registry.
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<commit> for every build, so a deploy names exactly what it runs,
      # and latest for main.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mccprogrammer/extpulse
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push from main)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse unchanged layers (the libraries) between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
