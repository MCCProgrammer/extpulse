name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs read the code; a job that needs more says so.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: SonarQube Cloud uses it to tell new code from old.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Checks formatting, compiles, runs every test (Testcontainers uses the runner's
      # Docker), packages the jar and checks test coverage (JaCoCo; the limits are in pom.xml).
      - name: Build and test
        run: ./mvnw -B verify

      # Code quality, bugs and coverage on sonarcloud.io; skipped until the token is set
      # (and on pull requests from forks, which don't get secrets).
      - name: SonarQube Cloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./mvnw -B sonar:sonar

      # Coverage in the run's summary page, also when the coverage check failed.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('target/site/jacoco/jacoco.csv') != '' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          def total(kind):
              covered = sum(int(r[kind + "_COVERED"]) for r in rows)
              missed = sum(int(r[kind + "_MISSED"]) for r in rows)
              return 100 * covered / (covered + missed), covered, covered + missed
          print("### Test coverage\n")
          print("| | Covered | |\n| --- | --- | --- |")
          for kind, name in (("LINE", "Lines"), ("BRANCH", "Branches")):
              percent, covered, all_ = total(kind)
              print(f"| {name} | {percent:.1f}% | {covered} of {all_} |")
          print("\nLimits: lines 85%, branches 70%, each *Service class 80% of lines.")
          EOF

      # The HTML report, to download from the run's page and see which lines are missed.
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('target/site/jacoco/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14

  secrets:
    # Every commit, not only the last: a secret deleted later is still in the history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the history for secrets (gitleaks)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  terraform:
    # The Oracle Cloud infrastructure (infra/oracle): formatted and valid. Planning and
    # applying need the account's API key and run from the maintainer's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Format and validate
        working-directory: infra/oracle
        run: |
          docker run --rm -v "$PWD":/work -w /work hashicorp/terraform:1.16.5 fmt -check -diff
          docker run --rm -v "$PWD":/work -w /work hashicorp/terraform:1.16.5 init -backend=false -input=false
          docker run --rm -v "$PWD":/work -w /work hashicorp/terraform:1.16.5 validate

  monitoring:
    # The monitoring configuration (deploy/): Prometheus' config and alert rules (and their
    # unit tests), Alertmanager's config and the Grafana dashboard, checked by the tools
    # that read them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Prometheus, Alertmanager and Grafana files
        working-directory: deploy
        # The same versions as compose.yaml, which Dependabot keeps up to date.
        run: |
          prometheus=$(grep -o 'prom/prometheus:[^ ]*' compose.yaml)
          alertmanager=$(grep -o 'prom/alertmanager:[^ ]*' compose.yaml)
          docker run --rm -v "$PWD/prometheus":/etc/prometheus --entrypoint promtool "$prometheus" check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/prometheus":/etc/prometheus --entrypoint promtool "$prometheus" test rules /etc/prometheus/alerts.test.yml
          docker run --rm -v "$PWD/alertmanager":/etc/alertmanager --entrypoint amtool "$alertmanager" check-config /etc/alertmanager/alertmanager.yml
          python3 -m json.tool grafana/dashboards/extpulse.json > /dev/null

  image:
    # The production image. Built on an Arm runner, natively, because the server
    # (Oracle Cloud Ampere A1) is Arm. Pull requests build it to check the Dockerfile;
    # pushes to main also publish it to the GitHub Container Registry.
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Third-party actions are pinned to a full commit SHA: a tag can be moved to other
      # code, a commit can't. Dependabot updates the SHA and the version comment.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<commit> for every build, so a deploy names exactly what it runs,
      # and latest for main.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mccprogrammer/extpulse
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push from main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse unchanged layers (the libraries) between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Pushes to main that built and published an image go to the server: the files in
    # deploy/ are copied to /opt/extpulse, and deploy.sh starts the new image (and goes
    # back to the previous one if it doesn't become healthy). Skipped until the repository
    # variable DEPLOY_HOST is set, so the pipeline works before there is a server.
    needs: [image, secrets]
    if: github.event_name == 'push' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://extpulse.mccprogrammer.com
    # One deploy at a time; a newer one waits instead of cancelling one halfway through.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7

      # The private key of the server's deploy user, and the server's host key, so SSH
      # refuses any other machine answering at that address.
      - name: SSH key and known host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          # The files and folders of deploy/, as one archive over the same SSH connection.
          tar -C deploy -czf - compose.yaml Caddyfile backup.sh offsite.sh deploy.sh prometheus alertmanager grafana \
            | ssh -o StrictHostKeyChecking=yes "deploy@${DEPLOY_HOST}" tar -xzf - -C /opt/extpulse
          ssh -o StrictHostKeyChecking=yes "deploy@${DEPLOY_HOST}" bash /opt/extpulse/deploy.sh "sha-${GITHUB_SHA::7}"

      # The same check as a visitor: the home page through DNS, the certificate and Caddy.
      # (The actuator isn't public in production.)
      - name: Check from outside
        run: curl --proto '=https' --tlsv1.2 -sSf -o /dev/null --retry 10 --retry-delay 6 --retry-all-errors https://extpulse.mccprogrammer.com/
