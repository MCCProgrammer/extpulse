name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Compiles, runs every test (Testcontainers uses the runner's Docker) and packages the jar.
      - name: Build and test
        run: ./mvnw -B verify
