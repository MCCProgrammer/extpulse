spring:
  application:
    name: extpulse

  # No datasource here: in development Spring Boot reads the connection from
  # compose.yaml, and in tests from the Testcontainers container. Production
  # will set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD as environment variables.

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match it
      # and fails at startup if they don't.
      ddl-auto: validate
    # Close the database session before the HTTP response is written, so lazy
    # loading can't run hidden queries from a controller.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Store and read timestamps in UTC; convert to Europe/Lisbon only for display.
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

extpulse:
  # The time zone of "a day": snapshot dates and schedules. Timestamps stay in UTC.
  zone: Europe/Lisbon

  collection:
    # Every day at 06:00 in extpulse.zone. "-" turns it off.
    cron: "0 0 6 * * *"
    # One attempt and up to three retries, waiting 1 s, 4 s and 16 s.
    attempts: 4
    first-retry-wait: 1s
    # At most one request per second to each store, so none of them blocks us.
    min-interval-per-store: 1s

  stores:
    marketplace-url: https://marketplace.visualstudio.com
    open-vsx-url: https://open-vsx.org
    chrome-web-store-url: https://chromewebstore.google.com
    # A store that doesn't answer in time fails the request instead of hanging.
    connect-timeout: 5s
    read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        # Only what is safe to show publicly; more after Spring Security is added.
        include: health,info
