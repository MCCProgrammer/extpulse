spring:
  application:
    name: extpulse

  # No datasource here: in development Spring Boot reads the connection from
  # compose.yaml, and in tests from the Testcontainers container. Production
  # will set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD as environment variables.

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match it
      # and fails at startup if they don't.
      ddl-auto: validate
    # Close the database session before the HTTP response is written, so lazy
    # loading can't run hidden queries from a controller.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Store and read timestamps in UTC; convert to Europe/Lisbon only for display.
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  # Alert emails. In development they go to Mailpit from compose.yaml; production sets
  # SPRING_MAIL_HOST, _PORT, _USERNAME and _PASSWORD (for example, Amazon SES over SMTP).
  mail:
    host: localhost
    port: 1025

extpulse:
  # The time zone of "a day": snapshot dates and schedules. Timestamps stay in UTC.
  zone: Europe/Lisbon

  auth:
    # The HMAC key that signs login tokens, at least 32 bytes. Production sets it with
    # EXTPULSE_AUTH_JWT_SECRET. Left empty, a random key is made at startup, so tokens
    # stop working when the app restarts; fine in development, never in production.
    jwt-secret: ""
    token-validity: 1h
    # Production closes registration (EXTPULSE_AUTH_REGISTRATION_OPEN=false) and lists
    # the owner's email in EXTPULSE_AUTH_REGISTRATION_ALLOW_LIST, so nobody else can sign
    # up and make the app call the stores for their extensions.
    registration-open: true
    registration-allow-list: []

  collection:
    # Every day at 06:00 in extpulse.zone. "-" turns it off.
    cron: "0 0 6 * * *"
    # One attempt and up to three retries, waiting 1 s, 4 s and 16 s.
    attempts: 4
    first-retry-wait: 1s
    # At most one request per second to each store, so none of them blocks us.
    min-interval-per-store: 1s

  alerts:
    mail-from: ExtPulse <alerts@extpulse.local>
    # Discord webhooks must start with one of these: the app calls the URL a user gives,
    # so it only calls Discord.
    discord-webhook-prefixes:
      - https://discord.com/api/webhooks/
      - https://discordapp.com/api/webhooks/
    # Alerts that couldn't be sent are tried again every 5 minutes, up to 5 times.
    delivery-cron: "0 */5 * * * *"
    max-attempts: 5
    # The weekly summary: Mondays at 08:00 in extpulse.zone, about the week before.
    weekly-summary-cron: "0 0 8 * * MON"

  stores:
    marketplace-url: https://marketplace.visualstudio.com
    open-vsx-url: https://open-vsx.org
    chrome-web-store-url: https://chromewebstore.google.com
    # The Chrome Web Store lists the reviews of one language at a time (the page's
    # language): one request each, every day.
    chrome-web-store-review-languages: [en, pt]
    # A store that doesn't answer in time fails the request instead of hanging.
    connect-timeout: 5s
    read-timeout: 10s

server:
  servlet:
    session:
      # The website's sign-in. The cookie is never readable by scripts (HttpOnly, the
      # default) and isn't sent with requests started by other sites (SameSite=Lax).
      # Production also marks it Secure, so it only travels over HTTPS.
      timeout: 8h
      cookie:
        same-site: lax

management:
  health:
    mail:
      # A mail server that is down doesn't make the app unhealthy: alerts that can't be
      # sent stay in the outbox and are retried. Health stays about the app and its database.
      enabled: false
  endpoints:
    web:
      exposure:
        # prometheus: the metrics Prometheus reads. Production serves the actuator on its
        # own port (MANAGEMENT_SERVER_PORT=8081), which only the containers next to the
        # app can reach; the public port then has no /actuator at all.
        include: health,info,prometheus
  metrics:
    distribution:
      # Latency buckets for HTTP requests, so Prometheus can compute percentiles (p95).
      percentiles-histogram:
        http.server.requests: true
